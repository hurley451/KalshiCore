name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to package.
        required: true
        type: string

jobs:
  release:
    name: Validate and publish suite snapshot
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set release tag
        id: release-tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test validator
        run: npm test

      - name: Validate contracts, fixtures, and targets
        run: npm run validate

      - name: Build suite archive
        run: |
          archive="kalshicore-${{ steps.release-tag.outputs.value }}.tar.gz"
          tar -czf "$archive" \
            README.md \
            CONTRIBUTING.md \
            package.json \
            package-lock.json \
            contracts \
            fixtures \
            sources \
            targets \
            docs \
            tools
          echo "archive=$archive" >> "$GITHUB_ENV"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.release-tag.outputs.value }}" "$archive" \
            --title "KalshiCore ${{ steps.release-tag.outputs.value }}" \
            --notes "Validated KalshiCore contract, fixture, target, and tooling snapshot."
